name: Compile ESP32 Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "esp32/**"
      - ".github/workflows/compile-esp32.yml"
  pull_request:
    paths:
      - "esp32/**"
      - ".github/workflows/compile-esp32.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install JPEGDEC@1.8.4
          arduino-cli lib install --git-url \
            https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59

      - name: Compile EE02 sketch
        run: >-
          arduino-cli compile
          --fqbn esp32:esp32:XIAO_ESP32S3_Plus
          --board-options PSRAM=opi
          esp32/bird_ee02
