name: Build Bird Dashboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # GitHub scheduled workflows use UTC. This is 4:17 AM Pacific during DST.
    # Avoid the top of the hour because scheduled runs can be delayed then.
    - cron: "17 11 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Render Raspberry Pi dashboard
        run: python build_dashboard.py --width 600 --height 448 --out public --require-image

      - name: Render EE02 13.3-inch dashboard
        run: >-
          python build_dashboard.py
          --width 1200
          --height 1600
          --out public
          --require-image
          --image-format jpeg
          --ee02-palette

      - name: Render EE02 13.3-inch bird plate
        run: python build_birdplate.py --out public

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
